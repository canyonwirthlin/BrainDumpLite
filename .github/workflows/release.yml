# Tag push (vX.Y.Z, made by release.ps1) -> tests -> frozen Python backend ->
# Tauri NSIS installer -> GitHub Release with installer, .sig and latest.json.
# The updater in every installed app reads latest.json from /releases/latest.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Signing secrets must exist
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # tauri.conf.json carries an updater public key, so the bundler REFUSES to
          # build without the matching private key. Fail here, in 2 seconds, with a
          # readable message, instead of 20 minutes later inside tauri-action.
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add it (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) under Settings > Secrets and variables > Actions. The value is the whole contents of ~/.tauri/braindumplite.key."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Python tests
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q          # -m matters: it puts the repo root on sys.path

      - name: Tag must match app/version.py
        shell: bash
        run: |
          v=$(python -c "from app.version import __version__; print(__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          { echo "body<<BDL_EOF"; python -m app.changelog "${GITHUB_REF_NAME#v}"; echo "BDL_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Freeze Python backend
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build-backend.ps1

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BrainDump Lite ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
