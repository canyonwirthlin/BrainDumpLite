<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick capture</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/tokens.css">
<script>
/* Same cached theme as the main window, applied before first paint. */
try {
  var r = document.documentElement, c = JSON.parse(localStorage.getItem("bdl-theme-css") || "null");
  if (c) { for (var k in c.vars) r.style.setProperty(k, c.vars[k]); r.dataset.theme = c.id; r.style.colorScheme = c.scheme; }
} catch (e) {}
</script>
<style>
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; padding: 14px 16px 12px; box-sizing: border-box; border: 1px solid var(--line); }
  h1 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600; letter-spacing: .02em; }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: inherit; line-height: 1.5; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .hint { flex: 1; color: var(--dim); font-size: 12px; }
  kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 11px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; background: var(--accent); color: #0d1017; font-weight: 600; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 12px; } .msg.bad { color: var(--red); } .msg.ok { color: var(--green); }
</style>
</head>
<body>
<h1>🧠 Quick capture</h1>
<textarea id="t" placeholder="What's on your mind? Don't organise it, just dump it." autofocus></textarea>
<div class="row">
  <span class="hint" id="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> save · <kbd>Esc</kbd> close</span>
  <button class="ghost" id="x">Close</button>
  <button id="go">Save dump</button>
</div>
<script>
(function () {
  var t = document.getElementById("t"), go = document.getElementById("go"), hint = document.getElementById("hint");
  var KEY = "bdl-quick-draft", idle = hint.innerHTML;
  function say(text, cls) { hint.className = "hint msg " + (cls || ""); hint.textContent = text; }
  try { t.value = localStorage.getItem(KEY) || ""; } catch (e) {}
  t.addEventListener("input", function () { try { localStorage.setItem(KEY, t.value); } catch (e) {} });
  // Called by the native shell every time the hotkey shows this window.
  window.bdlQuick = function () { hint.className = "hint"; hint.innerHTML = idle; go.disabled = false; t.focus(); t.setSelectionRange(t.value.length, t.value.length); };
  function close() { window.close(); }   // the shell turns this into "hide"
  async function save() {
    var text = t.value.trim();
    if (!text) { say("Nothing to save yet.", "bad"); return; }
    go.disabled = true; say("Saving…");
    try {
      var r = await fetch("/api/dumps", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text, mode: "freeform" }) });
      if (r.status === 423) throw new Error("BrainDump is locked - open the app and unlock it first.");
      if (!r.ok) throw new Error((await r.json().catch(function () { return {}; })).detail || r.statusText);
      t.value = ""; try { localStorage.removeItem(KEY); } catch (e) {}
      say("Saved ✓ - it'll be organised in the background.", "ok");
      setTimeout(close, 700);
    } catch (e) { say(e.message || "Couldn't save.", "bad"); go.disabled = false; }
  }
  go.onclick = save;
  document.getElementById("x").onclick = close;
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") close();
    else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
  });
  t.focus();
})();
</script>
</body>
</html>
