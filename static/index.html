<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainDump Lite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<script>
/* Apply saved theme before first paint — no flash of wrong colors. */
try { document.documentElement.dataset.theme = localStorage.getItem("bdl-theme") || "midnight"; } catch (e) {}
</script>
<link rel="stylesheet" href="style.css?v=0.5.0">
</head>
<body>
<header>
  <a class="logo" href="#capture">🧠 <span>BrainDump&nbsp;<em>Lite</em></span></a>
  <nav id="nav">
    <a href="#capture" data-v="capture">Capture</a>
    <a href="#history" data-v="history">History</a>
    <a href="#tasks" data-v="tasks">Tasks</a>
    <a href="#graph" data-v="graph">Graph</a>
    <a href="#search" data-v="search">Search</a>
    <a href="#reflect" data-v="reflect">Reflect</a>
    <a href="#settings" data-v="settings">Settings</a>
  </nav>
  <span id="update-pill" class="pill update" style="display:none;cursor:pointer" title="Click to see what's new and install">⬆ update</span>
  <a href="#settings" id="ai-pill" class="pill off">…</a>
</header>
<main id="view"></main>
<script src="app.js?v=0.5.0"></script>
</body>
</html>
